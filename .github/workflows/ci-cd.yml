name: Weather Pipeline CI/CD

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main

jobs:
  test-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Code
        # Catches syntax errors and undefined names before deployment
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-push: # This is the new CD job
    needs: [test-code]  # <-- CRITICAL: This waits for CI to pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-worker:${{ github.sha }}

      - name: Build & Push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./streamlit_app
          file: ./streamlit_app/Dockerfile
          push: true
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-dashboard:${{ github.sha }}
