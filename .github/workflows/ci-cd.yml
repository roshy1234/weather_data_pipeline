name: Weather Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Code
        # Catches syntax errors and undefined names before deployment
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Authenticate & Deploy to Prefect Cloud
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_WORKSPACE: ${{ secrets.PREFECT_WORKSPACE }}
        run: |
          prefect cloud login --key $PREFECT_API_KEY --workspace $PREFECT_WORKSPACE
          prefect deploy orchestrator.py:your_flow_function --name "Decoupled Weather ELT Pipeline" --pool "your-pool-name"