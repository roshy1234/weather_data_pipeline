services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: weather-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123" # HTTP port (used by dbt and web clients)
      - "9000:9000" # Native port (used by Python clients)
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  grafana:
    image: grafana/grafana:latest
    container_name: weather-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped
    # If you have a custom network defined for ClickHouse, add it here too

  prefect-worker:
    build: .
    container_name: prefect_weather_worker
    env_file:
      - .env
    depends_on:
      - clickhouse
    restart: unless-stopped

volumes:
  clickhouse_data:
  grafana-storage:

