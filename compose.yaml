services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: weather-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123" # HTTP port (used by dbt and web clients)
      - "9000:9000" # Native port (used by Python clients)
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_config/tuning.xml:/etc/clickhouse-server/config.d/tuning.xml
      - ./clickhouse_config/limits.xml:/etc/clickhouse-server/users.d/limits.xml
    deploy:
      resources:
        limits:
          memory: 1.5G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  grafana:
    image: grafana/grafana-oss:latest
    container_name: weather-grafana
    ports:
      - "3000:3000"
    environment:
      # Installs the official ClickHouse data source plugin on startup
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      # Forces the Go garbage collector to keep memory low
      - GOMEMLIMIT=100mbb
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Hard limit to prevent it from crashing the 1GB cloud server
          memory: 250M
    # If you have a custom network defined for ClickHouse, add it here too

  prefect-worker:
    image: roshyjamz/weather-worker:latest
    container_name: prefect_weather_worker
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    command: python orchestrator.py
    depends_on:
      - clickhouse
    restart: unless-stopped

  streamlit:
    image: roshyjamz/weather-dashboard:latest
    container_name: weather_dashboard
    ports:
      - "8501:8501"
    env_file:       
      - .env
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
  grafana-storage:

